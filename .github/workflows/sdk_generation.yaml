name: Generate
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: optionally set a specific SDK version
        type: string
  pull_request:
    types:
      - labeled
      - unlabeled
jobs:
  generate:
    name: Generate Target
    # Label events only matter when they change the version bump of the generation PR.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(fromJSON('["patch", "minor", "major", "graduate"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Speakeasy CLI
        run: curl -fsSL https://raw.githubusercontent.com/speakeasy-api/speakeasy/main/install.sh | sh

      - name: Generate and open pull request
        run: speakeasy ci generate
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          SPEAKEASY_ENVIRONMENT: github
          SPEAKEASY_RUN_LOCATION: action
          GIT_TERMINAL_PROMPT: "0"
          INPUT_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: pr
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
          INPUT_SET_VERSION: ${{ github.event.inputs.set_version }}
          INPUT_ENABLE_SDK_CHANGELOG: "true"
